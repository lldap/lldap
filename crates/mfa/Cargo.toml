[package]
name = "lldap_mfa"
version = "0.1.0"
description = "TOTP MFA helpers for LLDAP"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["seal"]
# At-rest sealing and seed generation; disabled for the wasm frontend,
# which only needs the TOTP math and encodings.
seal = ["dep:base64", "dep:orion", "dep:rand"]

[dependencies]
base64 = { workspace = true, optional = true }
data-encoding = "2"
hmac = "0.12"
orion = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sha1 = "0.10"
thiserror = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
