[package]
name = "lldap_mfa"
version = "0.1.1"
description = "TOTP MFA helpers for LLDAP"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["seal"]
# At-rest sealing; off for the wasm frontend, which only needs the TOTP math.
seal = ["dep:base64", "dep:bincode", "dep:orion", "dep:rand", "dep:serde"]

[dependencies]
base64 = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
data-encoding = "2"
hmac = "0.12"
orion = { workspace = true, optional = true }
percent-encoding = "2"
rand = { workspace = true, optional = true }
sha1 = "0.10"
thiserror = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
