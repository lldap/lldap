<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>LLDAP Administration</title>
    <base href="/">
    <script>
      /* Apply the persisted (or system) theme before paint to avoid a flash. */
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("theme"); } catch (e) {}
        var theme = stored
          || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", theme);
      })();
      function inDarkMode() {
        return document.documentElement.getAttribute("data-bs-theme") === "dark";
      }
      function toggleDarkMode() {
        var next = inDarkMode() ? "light" : "dark";
        document.documentElement.setAttribute("data-bs-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
      }
      function setThemeAccent(color) {
        if (color) {
          document.documentElement.style.setProperty("--lldap-accent", color);
        }
      }
      function setTheme(theme) {
        document.documentElement.setAttribute("data-bs-theme", theme);
        try { localStorage.setItem("theme", theme); } catch (e) {}
      }
    </script>
    <script src="/static/main.js" type="module" defer></script>
    <link
      href="/static/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" />
    <script
      src="/static/bootstrap.bundle.min.js"
      defer
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"></script>
    <link
      rel="stylesheet"
      href="/static/bootstrap-icons.css"
      integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" />
    <link
      rel="stylesheet"
      href="/static/fonts.css" />
    <link
      rel="stylesheet"
      href="/static/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <noscript>
        <!-- This will be displayed if the user doesn't have JavaScript enabled. -->
        LLDAP requires JavaScript, please switch to a compatible browser or
        enable it.
    </noscript>

    <script>
        /* Detect if the user has WASM support. */
        if (typeof WebAssembly === 'undefined') {
            const pWASMMsg = document.createElement("p")
            pWASMMsg.innerHTML = `
            LLDAP requires WASM and JIT for JavaScript, please switch to a
            compatible browser or enable it.
            `
            document.body.appendChild(pWASMMsg)
        }
    </script>
</body>

</html>
